spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/url_shortener?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  allowed-origin: ${APP_ALLOWED_ORIGIN:http://localhost:5173}
